<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fruities Order Tracker</title>

<style>
*{
  box-sizing:border-box;
  font-family:Inter,system-ui,sans-serif;
}

body{
  margin:0;
  background:#f4f7f5;
  color:#132218;
  padding:20px;
}

.card{
  max-width:700px;
  margin:0 auto;
  background:#fff;
  border-radius:24px;
  padding:24px;
  box-shadow:0 10px 40px rgba(0,0,0,.08);
}

h1{
  margin-top:0;
  font-size:28px;
}

.section{
  margin-top:24px;
}

.label{
  font-size:13px;
  opacity:.7;
  margin-bottom:4px;
}

.value{
  font-size:16px;
  font-weight:600;
}

.item{
  padding:12px 0;
  border-bottom:1px solid #eee;
}

.total{
  font-size:24px;
  font-weight:800;
  color:#1f8f4d;
}

.loading,
.error{
  text-align:center;
  margin-top:60px;
  font-size:18px;
}
</style>
</head>
<body>


<div style="text-align:center;margin-bottom:20px;">
  <button onclick="generateTestQR()" style="
    background:#1f8f4d;
    color:white;
    border:none;
    padding:12px 18px;
    border-radius:14px;
    font-weight:700;
    cursor:pointer;
  ">
    Generate Test QR
  </button>

  <div id="qrBox" style="margin-top:20px;"></div>
</div>

<div id="app" class="loading">Loading order...</div>


<script>
const DB_URL = 'https://fruities-pos-default-rtdb.asia-southeast1.firebasedatabase.app';
const STORE_ID = 'fruit-story-main';

function peso(n){
  return '₱' + Number(n || 0).toFixed(2);
}

async function loadOrder(){

  const params = new URLSearchParams(location.search);
  const orderId = params.get('order');

  if(!orderId){
    document.getElementById('app').innerHTML =
      '<div class="error">Missing order ID</div>';
    return;
  }

  try{

    const res = await fetch(
      DB_URL +
      '/stores/' +
      STORE_ID +
      '/orders/' +
      orderId +
      '.json'
    );

    const order = await res.json();

    if(!order){
      document.getElementById('app').innerHTML =
        '<div class="error">Order not found</div>';
      return;
    }

    document.getElementById('app').innerHTML = `
      <div class="card">

        <h1>🍓 Fruities Order Details</h1>

        <div class="section">
          <div class="label">Order ID</div>
          <div class="value">${order.orderId || order.id || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Order Date</div>
          <div class="value">
  ${
    order.time
      ? new Date(order.time).toLocaleString('en-PH', {
          year:'numeric',
          month:'long',
          day:'numeric',
          hour:'numeric',
          minute:'2-digit'
        })
      : (order.orderDate || order.createdAt || '-')
  }
</div>
        </div>

        <div class="section">
          <div class="label">Source</div>
          <div class="value">
  ${
    order.orderSourceLabel || order.orderSource || order.source || '-'
  }${
    order.orderSourceDetail
      ? ' - ' + order.orderSourceDetail
      : ''
  }
</div>
        </div>

        <div class="section">
          <div class="label">Customer Name</div>
          <div class="value">${order.customerName || order.cust || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Customer Number</div>
          <div class="value">${order.customerNumber || order.phone || order.cp || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Recipient Name</div>
          <div class="value">${order.recipientName || order.recipient || order.rname || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Recipient Number</div>
          <div class="value">${order.recipientNumber || order.recipientPhone || order.rp || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Address</div>
          <div class="value">${order.address || order.addr || order.deliveryAddress || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Items</div>

          ${(order.items || []).map(item => `
            <div class="item">
              <strong>${item.name || item.n}</strong><br>
              Qty: ${item.qty || item.q} × ${peso(item.price || item.p)}
            </div>
          `).join('')}
        </div>

        <div class="section">
          <div class="label">Payment Method</div>
          <div class="value">${order.paymentMethod || order.ch || '-'}</div>
        </div>

        <div class="section">
          <div class="label">Delivery Type</div>
          <div class="value">${(order.deliveryType || order.fulfillmentType || '').toLowerCase()==='delivery' ? '🚚 Delivery' : ((order.deliveryType || order.fulfillmentType || '').toLowerCase()==='pickup' ? '🛍️ Pick Up' : '-')}</div>
        </div>

        <div class="section">
          <div class="label">${
  ((order.deliveryType || order.fulfillmentType || '').toLowerCase()==='pickup')
    ? 'Pickup Date'
    : 'Delivery Date'
}</div>
          <div class="value">${(order.deliveryDate || order.delivery_date || '') + ((order.deliveryTime || order.delivery_time) ? ' • ' + (order.deliveryTime || order.delivery_time) : '')}</div>
        </div>

        ${
          ((order.deliveryType || order.fulfillmentType || '').toLowerCase()==='pickup')
          ? ''
          : `
        <div class="section">
          <div class="label">Delivery Fee</div>
          <div class="value">${order.deliveryFeeType || order.deliveryFeeCode || order.delivery_fee_code || '-'}</div>
        </div>
        `
        }

        <div class="section">
          <div class="label">Total</div>
          <div class="total">${peso(order.total || 0)}</div>
        </div>

      </div>
    `;

  }catch(err){

    document.getElementById('app').innerHTML =
      '<div class="error">Failed to load order</div>';

    console.error(err);
  }
}

loadOrder();

function generateTestQR(){

  const url =
    'https://fruities-six.vercel.app/track.html?order=TEST123';

  document.getElementById('qrBox').innerHTML = `
    <img
      src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(url)}"
      style="border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.12);"
    />

    <div style="margin-top:12px;font-size:14px;">
      Scan this QR using your phone camera
    </div>
  `;
}
</script>

</body>
</html>
