<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fruities Order Tracking</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}

:root{
  --green:#0db83f;
  --green-dark:#08752a;
  --text:#101820;
  --muted:#5d6673;
  --card:#fff;
  --line:#12b83f;
  --pending:#dcebdd;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:url("/assets/tracker/tracker-bg.png") center/cover no-repeat fixed,#faf7f2;
}

.page{
  max-width:980px;
  margin:0 auto;
  padding:22px 16px 42px;
}

.topbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:4px;
}

.topbar button,
.topbar a{
  border:0;
  background:transparent;
  color:var(--green-dark);
  font-size:18px;
  font-weight:800;
  text-decoration:none;
  padding:8px;
}

.logo{
  text-align:center;
  margin:4px 0 26px;
}

.logo img{
  width:310px;
  max-width:78%;
  height:auto;
}

.tracker{
  display:grid;
  grid-template-columns:76px 1fr;
  gap:16px;
  max-width:780px;
  margin:0 auto;
}

.rail{
  position:relative;
  padding-top:38px;
}

.rail::before{
  content:"";
  position:absolute;
  left:35px;
  top:50px;
  bottom:54px;
  width:6px;
  background:var(--pending);
  border-radius:99px;
}

.rail-fill{
  position:absolute;
  left:35px;
  top:50px;
  width:6px;
  height:0;
  background:var(--line);
  border-radius:99px;
  transition:.3s ease;
}

.dots{
  position:relative;
  z-index:2;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:54px;
}

.dot{
  width:58px;
  height:58px;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:#edf1ee;
  border:5px solid #fff;
  color:#fff;
  font-size:26px;
  font-weight:900;
  box-shadow:0 8px 22px rgba(0,0,0,.08);
}

.dot.done,
.dot.active{
  background:var(--green);
}

.dot.active{
  box-shadow:0 0 0 8px rgba(13,184,63,.14),0 12px 24px rgba(13,184,63,.18);
}

.cards{
  display:flex;
  flex-direction:column;
  gap:22px;
}

.step-card{
  min-height:132px;
  display:grid;
  grid-template-columns:1fr 132px;
  gap:16px;
  align-items:center;
  padding:22px 24px;
  background:var(--card);
  border-radius:24px;
  border:2px solid transparent;
  box-shadow:0 12px 34px rgba(20,80,35,.09);
  opacity:.42;
  transition:.25s ease;
}

.step-card.done,
.step-card.active{
  opacity:1;
}

.step-card.active{
  border-color:#63e079;
  box-shadow:0 14px 38px rgba(13,184,63,.16);
}

.step-card h3{
  margin:0 0 10px;
  font-size:24px;
  line-height:1.15;
  font-weight:900;
}

.step-card p{
  margin:0;
  color:var(--muted);
  font-size:16px;
  line-height:1.45;
}

.step-card.active h3{
  color:var(--green-dark);
}

.time{
  margin-top:12px;
  color:var(--green-dark);
  font-size:14px;
  font-weight:900;
}

.art{
  text-align:right;
}

.art img{
  width:100%;
  max-width:126px;
  height:auto;
  display:inline-block;
}

.step-card[data-step="delivered"].active{
  background:linear-gradient(90deg,#fff,#f1fff3);
}

.footer{
  max-width:780px;
  margin:26px auto 0;
  padding:18px 20px;
  border-radius:22px;
  background:rgba(235,249,237,.94);
  color:#165b27;
  font-size:17px;
  line-height:1.35;
  text-align:center;
  font-weight:800;
  box-shadow:0 8px 24px rgba(20,80,35,.06);
}

@media(max-width:700px){
  .page{padding:14px 12px 32px}
  .logo{margin:4px 0 22px}
  .logo img{width:250px}

  .tracker{
    grid-template-columns:58px 1fr;
    gap:8px;
  }

  .rail{padding-top:30px}
  .rail::before,
  .rail-fill{
    left:27px;
    top:42px;
    width:5px;
  }

  .dots{gap:48px}

  .dot{
    width:48px;
    height:48px;
    font-size:21px;
    border-width:4px;
  }

  .step-card{
    min-height:122px;
    grid-template-columns:1fr 92px;
    gap:10px;
    padding:18px 16px;
    border-radius:20px;
  }

  .step-card h3{
    font-size:20px;
    margin-bottom:8px;
  }

  .step-card p{
    font-size:14px;
  }

  .time{
    font-size:12.5px;
    margin-top:9px;
  }

  .art img{max-width:86px}

  .footer{
    font-size:14px;
    padding:15px;
    border-radius:18px;
  }
}

@media(max-width:390px){
  .step-card{
    grid-template-columns:1fr 78px;
    padding:16px 14px;
  }

  .art img{max-width:76px}
  .step-card h3{font-size:18px}
  .step-card p{font-size:13px}
}

/* tracker-transparent-logo-final-v1 */
.logo img{
  background:transparent !important;
  width:260px !important;
  max-width:75% !important;
  height:auto !important;
  object-fit:contain !important;
}

@media(max-width:700px){
  .logo img{
    width:220px !important;
    max-width:72% !important;
  }
}


/* tracker-active-glow-fix-v1 */

/* completed cards: clean, no glow */
.step-card.done{
  opacity:1 !important;
  border-color:transparent !important;
  box-shadow:0 8px 22px rgba(20,80,35,.07) !important;
}

/* pending cards: faded */
.step-card.pending{
  opacity:.42 !important;
  border-color:transparent !important;
  box-shadow:0 8px 18px rgba(20,80,35,.04) !important;
}

/* active card: main glow */
.step-card.active{
  opacity:1 !important;
  border-color:#51e86e !important;
  background:rgba(255,255,255,.96) !important;
  box-shadow:
    0 0 0 2px rgba(34,197,94,.14),
    0 0 26px rgba(34,197,94,.28),
    0 14px 36px rgba(20,80,35,.12) !important;
  transform:translateY(-1px);
}

/* active heading */
.step-card.active h3{
  color:#08752a !important;
}

/* delivered active: success glow */
.step-card[data-step="delivered"].active{
  background:linear-gradient(90deg,#ffffff,#f0fff3) !important;
  border-color:#38e85f !important;
  box-shadow:
    0 0 0 2px rgba(34,197,94,.18),
    0 0 34px rgba(34,197,94,.35),
    0 16px 42px rgba(20,80,35,.14) !important;
}

/* active dot glow */
.dot.active{
  background:#0db83f !important;
  box-shadow:
    0 0 0 8px rgba(13,184,63,.16),
    0 0 24px rgba(13,184,63,.38) !important;
}

/* done dots normal */
.dot.done:not(.active){
  background:#0db83f !important;
  box-shadow:0 6px 16px rgba(13,184,63,.16) !important;
}

/* mobile: keep glow softer */
@media(max-width:700px){
  .step-card.active{
    box-shadow:
      0 0 0 1px rgba(34,197,94,.16),
      0 0 18px rgba(34,197,94,.24),
      0 10px 24px rgba(20,80,35,.10) !important;
    transform:none;
  }

  .step-card[data-step="delivered"].active{
    box-shadow:
      0 0 0 1px rgba(34,197,94,.18),
      0 0 22px rgba(34,197,94,.28),
      0 10px 26px rgba(20,80,35,.10) !important;
  }
}


/* tracker-align-timeline-dots-v1 */

/* Align green circles with center of cards */
.rail{
  padding-top:46px !important;
}

.rail::before,
.rail-fill{
  top:74px !important;
}

.dots{
  gap:84px !important;
}

/* desktop/tablet card alignment */
@media(min-width:701px){
  .rail{
    padding-top:46px !important;
  }

  .rail::before,
  .rail-fill{
    top:75px !important;
  }

  .dots{
    gap:84px !important;
  }
}

/* mobile alignment */
@media(max-width:700px){
  .rail{
    padding-top:40px !important;
  }

  .rail::before,
  .rail-fill{
    top:63px !important;
  }

  .dots{
    gap:70px !important;
  }
}

/* small mobile */
@media(max-width:390px){
  .rail{
    padding-top:38px !important;
  }

  .rail::before,
  .rail-fill{
    top:61px !important;
  }

  .dots{
    gap:66px !important;
  }
}


/* tracker-absolute-dot-align-v1 */

/* Make timeline dots align by fixed positions, not flex gap */
.rail{
  padding-top:0 !important;
  min-height:560px !important;
}

.dots{
  position:relative !important;
  display:block !important;
  height:560px !important;
}

.dot{
  position:absolute !important;
  left:50% !important;
  transform:translateX(-50%) !important;
}

.dot:nth-child(1){ top:48px !important; }
.dot:nth-child(2){ top:164px !important; }
.dot:nth-child(3){ top:280px !important; }
.dot:nth-child(4){ top:396px !important; }

.rail::before{
  left:35px !important;
  top:76px !important;
  bottom:auto !important;
  height:368px !important;
}

.rail-fill{
  left:35px !important;
  top:76px !important;
}

/* match JS fill heights to dot centers visually */
@media(max-width:700px){
  .rail{
    min-height:500px !important;
  }

  .dots{
    height:500px !important;
  }

  .dot:nth-child(1){ top:42px !important; }
  .dot:nth-child(2){ top:146px !important; }
  .dot:nth-child(3){ top:250px !important; }
  .dot:nth-child(4){ top:354px !important; }

  .rail::before{
    left:27px !important;
    top:66px !important;
    height:336px !important;
  }

  .rail-fill{
    left:27px !important;
    top:66px !important;
  }
}

</style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <button onclick="history.back()">‹</button>
    <a href="/">Help</a>
  </div>

  <div class="logo">
    <img src="/assets/tracker/fruities-logo-transparent.png" alt="Fruities">
  </div>

  <div class="tracker">
    <div class="rail">
      <div class="rail-fill" id="railFill"></div>
      <div class="dots">
        <div class="dot" data-dot="confirmed">✓</div>
        <div class="dot" data-dot="preparing">✓</div>
        <div class="dot" data-dot="out">✓</div>
        <div class="dot" data-dot="delivered">●</div>
      </div>
    </div>

    <div class="cards">
      <section class="step-card" data-step="confirmed">
        <div>
          <h3>Order confirmed</h3>
          <p>Your order is confirmed.</p>
          <div class="time" id="time-confirmed"></div>
        </div>
        <div class="art"><img src="/assets/tracker/order-confirmed.png" alt=""></div>
      </section>

      <section class="step-card" data-step="preparing">
        <div>
          <h3>Preparing</h3>
          <p>We’re preparing your order.</p>
          <div class="time" id="time-preparing"></div>
        </div>
        <div class="art"><img src="/assets/tracker/preparing.png" alt=""></div>
      </section>

      <section class="step-card" data-step="out">
        <div>
          <h3>Out for delivery</h3>
          <p>Your rider is on the way to deliver your order.</p>
          <div class="time" id="time-out"></div>
        </div>
        <div class="art"><img src="/assets/tracker/out-for-delivery.png" alt=""></div>
      </section>

      <section class="step-card delivered" data-step="delivered">
        <div>
          <h3>Delivered</h3>
          <p id="deliveredText">We’ll update you here once your order is delivered.</p>
          <div class="time" id="time-delivered"></div>
        </div>
        <div class="art"><img src="/assets/tracker/delivered.png" alt=""></div>
      </section>
    </div>
  </div>

  <div class="footer" id="footerNote">
    ✅ We’re handling your order with care. Thank you for choosing Fruities!
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAq7mXoVMsBKGHzzh6JaRQTVy1Aqq41XbQ",
  authDomain: "fruities-pos.firebaseapp.com",
  databaseURL: "https://fruities-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fruities-pos",
  storageBucket: "fruities-pos.firebasestorage.app",
  messagingSenderId: "263637850283",
  appId: "1:263637850283:web:8b487bcdb0f25c7b063fee"
};

const STORE_ID = "fruit-story-main";
const STEPS = ["confirmed","preparing","out","delivered"];

function setLiveStep(step){
  if(step === "placed") step = "confirmed";
  const index = Math.max(0, STEPS.indexOf(step));

  document.querySelectorAll(".step-card").forEach((card,i)=>{
    card.classList.remove("done","active","pending");
    if(i < index) card.classList.add("done");
    else if(i === index) card.classList.add("active");
    else card.classList.add("pending");
  });

  document.querySelectorAll(".dot").forEach((dot,i)=>{
    dot.classList.remove("done","active");
    if(i < index) dot.classList.add("done");
    if(i === index) dot.classList.add("active");
  });

  const fillHeights = ["0px","104px","208px","336px"];
  const railFill = document.getElementById("railFill");
  if(railFill) railFill.style.height = fillHeights[index] || "0px";

  const footer = document.getElementById("footerNote");
  const deliveredText = document.getElementById("deliveredText");

  if(step === "delivered"){
    if(footer) footer.textContent = "✅ Delivered successfully. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "Your order has been delivered successfully.";
  }else if(step === "out"){
    if(footer) footer.textContent = "🛵 Your rider is on the way. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }else if(step === "preparing"){
    if(footer) footer.textContent = "🍓 We’re preparing your order with care.";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }else{
    if(footer) footer.textContent = "✅ We’re handling your order with care. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }
}

function fmtTime(v){
  if(!v) return "";
  try{
    return new Date(v).toLocaleString("en-PH",{
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    });
  }catch(e){ return ""; }
}

function applyTimes(order){
  document.getElementById("time-confirmed").textContent =
    fmtTime(order.time || order.createdAt || order.createdByAt);

  document.getElementById("time-preparing").textContent =
    fmtTime(order.kitStart || order.preparingAt);

  document.getElementById("time-out").textContent =
    fmtTime(order.outForDeliveryAt || order.deliveryOutAt || order.kitOutAt);

  document.getElementById("time-delivered").textContent =
    fmtTime(order.deliveredAt || order.deliveryDeliveredAt || order.deliveryDoneAt);
}

function detectStep(order){
  order = order || {};
  const delivery = String(order.deliveryStatus || order.delivery_status || "").toLowerCase();
  const kit = String(order.kitStatus || "").toLowerCase();
  const kitchen = String(order.kitchenStatus || "").toLowerCase();
  const status = String(order.status || "").toLowerCase();

  if(delivery === "delivered" || delivery === "done" || status === "delivered") return "delivered";
  if(delivery === "out" || delivery === "out_for_delivery" || kit === "out" || kitchen === "out") return "out";
  if(kit === "preparing" || kitchen === "preparing" || kit === "ready" || kitchen === "ready") return "preparing";
  return "confirmed";
}

function cleanKey(v){
  return String(v || "").replace(/[.#$[\]/]/g,"_");
}

function loadLiveOrder(){
  const params = new URLSearchParams(location.search);
  const orderId = params.get("id") || params.get("order");

  if(!orderId){
    setLiveStep(params.get("step") || "confirmed");
    return;
  }

  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const key = cleanKey(orderId);
    const ref = firebase.database().ref("stores/" + STORE_ID + "/orders/" + key);

    ref.on("value", snap=>{
      const order = snap.val();
      if(!order){
        setLiveStep("confirmed");
        return;
      }
      setLiveStep(detectStep(order));
      applyTimes(order);
    }, ()=>{
      setLiveStep(params.get("step") || "confirmed");
    });
  }catch(e){
    console.warn(e);
    setLiveStep(params.get("step") || "confirmed");
  }
}

loadLiveOrder();
</script>
</body>
</html>
