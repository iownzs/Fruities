<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
/* tracker-smart-circle-align-v1 */
let CURRENT_TRACKER_STEP = "confirmed";

function syncTrackerCircles(){
  const tracker = document.querySelector(".tracker");
  const rail = document.querySelector(".rail");
  const cards = Array.from(document.querySelectorAll(".step-card"));
  const dots = Array.from(document.querySelectorAll(".dot"));
  const fill = document.getElementById("railFill");

  if(!tracker || !rail || !cards.length || !dots.length) return;

  const trackerTop = tracker.getBoundingClientRect().top;
  const centers = cards.map(card => {
    const r = card.getBoundingClientRect();
    return (r.top - trackerTop) + (r.height / 2);
  });

  dots.forEach((dot, i) => {
    if(centers[i] != null){
      dot.style.top = centers[i] + "px";
    }
  });

  const first = centers[0] || 0;
  const last = centers[centers.length - 1] || first;
  rail.style.setProperty("--rail-top", first + "px");
  rail.style.setProperty("--rail-height", Math.max(0, last - first) + "px");

  const stepIndex = Math.max(0, STEPS.indexOf(CURRENT_TRACKER_STEP === "placed" ? "confirmed" : CURRENT_TRACKER_STEP));
  const activeCenter = centers[stepIndex] || first;

  rail.style.setProperty("--rail-fill", Math.max(0, activeCenter - first) + "px");

  const railHeight = (tracker.getBoundingClientRect().height || last + 80);
  rail.style.minHeight = railHeight + "px";

  if(fill){
    fill.style.height = Math.max(0, activeCenter - first) + "px";
  }
}

window.addEventListener("resize", syncTrackerCircles);
window.addEventListener("load", function(){
  setTimeout(syncTrackerCircles, 80);
  setTimeout(syncTrackerCircles, 400);
});

document.querySelectorAll(".art img, .logo img").forEach(img => {
  img.addEventListener("load", function(){
    setTimeout(syncTrackerCircles, 60);
  });
});


/* tracker-card-attached-timeline-v1 */
function syncTrackerCircles(){
  const cardsBox = document.querySelector(".cards");
  const cards = Array.from(document.querySelectorAll(".step-card"));
  if(!cardsBox || !cards.length) return;

  const first = cards[0].offsetTop + cards[0].offsetHeight / 2;
  const last = cards[cards.length - 1].offsetTop + cards[cards.length - 1].offsetHeight / 2;

  const stepName = CURRENT_TRACKER_STEP === "placed" ? "confirmed" : CURRENT_TRACKER_STEP;
  const stepIndex = Math.max(0, STEPS.indexOf(stepName));
  const active = cards[stepIndex]
    ? cards[stepIndex].offsetTop + cards[stepIndex].offsetHeight / 2
    : first;

  cardsBox.style.setProperty("--track-top", first + "px");
  cardsBox.style.setProperty("--track-height", Math.max(0, last - first) + "px");
  cardsBox.style.setProperty("--track-fill", Math.max(0, active - first) + "px");
}

window.addEventListener("resize", function(){
  setTimeout(syncTrackerCircles, 50);
});

window.addEventListener("load", function(){
  setTimeout(syncTrackerCircles, 100);
  setTimeout(syncTrackerCircles, 500);
});

document.querySelectorAll(".art img,.logo img").forEach(function(img){
  img.addEventListener("load", function(){
    setTimeout(syncTrackerCircles, 80);
  });
});




</script>

/* tracker-checkpoint-logo-animations-v1 */

/* base image animation smoothing */
.step-card .art img{
  transform-origin:center;
  will-change:transform, filter, opacity;
}

/* completed checkpoints: subtle success pop */
.step-card.done[data-step="confirmed"] .art img{
  animation:checkpointPop 2.6s ease-in-out infinite;
}

.step-card.done[data-step="preparing"] .art img{
  animation:checkpointFloat 3.2s ease-in-out infinite;
}

/* active preparing */
.step-card.active[data-step="preparing"] .art img{
  animation:checkpointFloat 2.2s ease-in-out infinite;
}

/* active rider */
.step-card.active[data-step="out"] .art img{
  animation:riderDrive 2.8s ease-in-out infinite;
}

/* completed out step */
.step-card.done[data-step="out"] .art img{
  animation:riderTinyMove 3.4s ease-in-out infinite;
}

/* active delivered */
.step-card.active[data-step="delivered"] .art img{
  animation:deliveredGlow 2.2s ease-in-out infinite;
}

/* completed delivered */
.step-card.done[data-step="delivered"] .art img{
  animation:deliveredGlow 3s ease-in-out infinite;
}

/* pending icons stay quiet */
.step-card.pending .art img{
  animation:none !important;
  filter:saturate(.8);
}

/* active card small breathing glow */
.step-card.active{
  animation:activeCardBreath 2.4s ease-in-out infinite;
}

@keyframes checkpointPop{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.045) rotate(-1deg)}
}

@keyframes checkpointFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-7px)}
}

@keyframes riderDrive{
  0%{transform:translateX(-5px) translateY(0)}
  50%{transform:translateX(9px) translateY(-2px)}
  100%{transform:translateX(-5px) translateY(0)}
}

@keyframes riderTinyMove{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(5px)}
}

@keyframes deliveredGlow{
  0%,100%{
    transform:scale(1);
    filter:drop-shadow(0 0 0 rgba(34,197,94,0));
  }
  50%{
    transform:scale(1.055);
    filter:drop-shadow(0 8px 14px rgba(34,197,94,.22));
  }
}

@keyframes activeCardBreath{

        0 0 14px rgba(13,184,63,.55);
    }
    50%{
      transform:translate(-50%,-50%) scale(1.16);
      box-shadow:
        0 0 0 9px rgba(13,184,63,.24),
        0 0 26px rgba(13,184,63,.80);
    }
  }
}


/* tracker-visible-circle-pulse-v1 */

/* Make sure pulse is not clipped */
.cards,
.step-card{
  overflow:visible !important;
}

/* Active circle: visible expanding ring */
.step-card.active::before{
  z-index:20 !important;
  background:#0db83f !important;
  color:#fff !important;
  content:"•" !important;
  animation:visibleActiveCirclePulse 1.25s ease-out infinite !important;
  box-shadow:
    0 0 0 0 rgba(13,184,63,.70),
    0 0 18px rgba(13,184,63,.95),
    0 0 34px rgba(13,184,63,.55) !important;
}

/* Keep done circles still */
.step-card.done:not(.active)::before{
  animation:none !important;
  box-shadow:
    0 0 0 3px rgba(13,184,63,.16),
    0 6px 14px rgba(13,184,63,.26) !important;
}

/* Strong visible pulse */
@keyframes visibleActiveCirclePulse{
  0%{
    transform:translate(-50%,-50%) scale(1);
    box-shadow:
      0 0 0 0 rgba(13,184,63,.75),
      0 0 16px rgba(13,184,63,.95),
      0 0 30px rgba(13,184,63,.55);
  }
  60%{
    transform:translate(-50%,-50%) scale(1.08);
    box-shadow:
      0 0 0 18px rgba(13,184,63,0),
      0 0 24px rgba(13,184,63,.95),
      0 0 44px rgba(13,184,63,.65);
  }
  100%{
    transform:translate(-50%,-50%) scale(1);
    box-shadow:
      0 0 0 24px rgba(13,184,63,0),
      0 0 16px rgba(13,184,63,.75),
      0 0 30px rgba(13,184,63,.45);
  }
}

/* Mobile: make pulse ring larger because it is harder to see */
@media(max-width:700px){
  .step-card.active::before{
    animation:visibleActiveCirclePulseMobile 1.15s ease-out infinite !important;
  }

  @keyframes visibleActiveCirclePulseMobile{
    0%{
      transform:translate(-50%,-50%) scale(1);
      box-shadow:
        0 0 0 0 rgba(13,184,63,.85),
        0 0 18px rgba(13,184,63,1),
        0 0 34px rgba(13,184,63,.65);
    }
    60%{
      transform:translate(-50%,-50%) scale(1.12);
      box-shadow:
        0 0 0 16px rgba(13,184,63,0),
        0 0 26px rgba(13,184,63,1),
        0 0 48px rgba(13,184,63,.75);
    }
    100%{
      transform:translate(-50%,-50%) scale(1);
      box-shadow:
        0 0 0 22px rgba(13,184,63,0),
        0 0 18px rgba(13,184,63,.85),
        0 0 34px rgba(13,184,63,.55);
    }
  }
}


/* tracker-active-circle-bounce-v1 */

/* Keep all card overflow visible so circle animation is not clipped */
.cards,
.step-card{
  overflow:visible !important;
}

/* Completed circles: still */
.step-card.done:not(.active)::before{
  content:"✓" !important;
  animation:none !important;
  background:#0db83f !important;
  color:#fff !important;
  box-shadow:
    0 0 0 3px rgba(13,184,63,.12),
    0 6px 14px rgba(13,184,63,.24) !important;
}

/* Pending circles: still */
.step-card.pending::before{
  content:"" !important;
  animation:none !important;
  background:#edf1ee !important;
  box-shadow:0 5px 12px rgba(0,0,0,.06) !important;
}

/* Active circle: clear bounce + pulse glow */
.step-card.active::before{
  content:"●" !important;
  background:#0db83f !important;
  color:#fff !important;
  z-index:20 !important;
  animation:activeCircleBounceGlow 1.25s ease-in-out infinite !important;
  box-shadow:
    0 0 0 5px rgba(13,184,63,.22),
    0 0 20px rgba(13,184,63,.75),
    0 0 40px rgba(13,184,63,.48) !important;
}

/* Active card glow stays strong */
.step-card.active{
  animation:activeCardStrongBreath 2.2s ease-in-out infinite !important;
}

@keyframes activeCircleBounceGlow{
  0%,100%{
    transform:translate(-50%,-50%) scale(1);
    box-shadow:
      0 0 0 5px rgba(13,184,63,.22),
      0 0 18px rgba(13,184,63,.72),
      0 0 36px rgba(13,184,63,.42);
  }
  50%{
    transform:translate(-50%,-50%) scale(1.18);
    box-shadow:
      0 0 0 12px rgba(13,184,63,.18),
      0 0 30px rgba(13,184,63,.95),
      0 0 56px rgba(13,184,63,.62);
  }
}

@keyframes activeCardStrongBreath{
  0%,100%{
    box-shadow:
      0 0 0 2px rgba(34,197,94,.30),
      0 0 22px rgba(34,197,94,.45),
      0 0 48px rgba(34,197,94,.32),
      0 16px 42px rgba(19,80,34,.18) !important;
  }
  50%{
    box-shadow:
      0 0 0 3px rgba(34,197,94,.46),
      0 0 34px rgba(34,197,94,.70),
      0 0 68px rgba(34,197,94,.52),
      0 20px 52px rgba(19,80,34,.24) !important;
  }
}

@media(prefers-reduced-motion:reduce){
  .step-card,
  .step-card::before{
    animation:none !important;
  }
}


/* tracker-real-active-circle-pulse-v1 */

/* Real animated pulse overlay on active circle */
.active-dot-pulse{
  position:absolute;
  left:-56px;
  top:50%;
  width:48px;
  height:48px;
  border-radius:999px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:30;
  border:3px solid rgba(13,184,63,.90);
  box-shadow:
    0 0 0 0 rgba(13,184,63,.60),
    0 0 22px rgba(13,184,63,.85);
  animation:realActiveCirclePulse 1.15s ease-out infinite;
}

.active-dot-pulse::after{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:999px;
  background:#0db83f;
  box-shadow:0 0 18px rgba(13,184,63,.85);
}

@keyframes realActiveCirclePulse{
  0%{
    transform:translate(-50%,-50%) scale(.92);
    opacity:1;
    box-shadow:
      0 0 0 0 rgba(13,184,63,.70),
      0 0 22px rgba(13,184,63,.90);
  }
  70%{
    transform:translate(-50%,-50%) scale(1.18);
    opacity:.78;
    box-shadow:
      0 0 0 18px rgba(13,184,63,0),
      0 0 36px rgba(13,184,63,.95);
  }
  100%{
    transform:translate(-50%,-50%) scale(.92);
    opacity:1;
    box-shadow:
      0 0 0 0 rgba(13,184,63,0),
      0 0 22px rgba(13,184,63,.70);
  }
}

@media(max-width:700px){
  .active-dot-pulse{
    left:-31px;
    width:38px;
    height:38px;
  }

  .active-dot-pulse::after{
    inset:7px;
  }
}

@media(max-width:390px){
  .active-dot-pulse{
    left:-27px;
    width:34px;
    height:34px;
  }

  .active-dot-pulse::after{
    inset:6px;
  }
}

</style>
</head>

<body>
<div class="page">
  <div class="topbar">
    <button onclick="history.back()">‹</button>
    <a href="/">Help</a>
  </div>

  <div class="logo">
    <img src="/assets/tracker/fruities-logo-transparent.png" alt="Fruities">
  </div>

  <div class="tracker">
    <div class="rail">
      <div class="rail-fill" id="railFill"></div>
      <div class="dots">
        <div class="dot" data-dot="confirmed">✓</div>
        <div class="dot" data-dot="preparing">✓</div>
        <div class="dot" data-dot="out">✓</div>
        <div class="dot" data-dot="delivered">●</div>
      </div>
    </div>

    <div class="cards">
      <section class="step-card" data-step="confirmed">
        <div>
          <h3>Order confirmed</h3>
          <p>Your order is confirmed.</p>
          <div class="time" id="time-confirmed"></div>
        </div>
        <div class="art"><img src="/assets/tracker/order-confirmed.png" alt=""></div>
      </section>

      <section class="step-card" data-step="preparing">
        <div>
          <h3>Preparing</h3>
          <p>We’re preparing your order.</p>
          <div class="time" id="time-preparing"></div>
        </div>
        <div class="art"><img src="/assets/tracker/preparing.png" alt=""></div>
      </section>

      <section class="step-card" data-step="out">
        <div>
          <h3>Out for delivery</h3>
          <p>Your rider is on the way to deliver your order.</p>
          <div class="time" id="time-out"></div>
        </div>
        <div class="art"><img src="/assets/tracker/out-for-delivery.png" alt=""></div>
      </section>

      <section class="step-card delivered" data-step="delivered">
        <div>
          <h3>Delivered</h3>
          <p id="deliveredText">We’ll update you here once your order is delivered.</p>
          <div class="time" id="time-delivered"></div>
        </div>
        <div class="art"><img src="/assets/tracker/delivered.png" alt=""></div>
      </section>
    </div>
  </div>

  <div class="footer" id="footerNote">
    ✅ We’re handling your order with care. Thank you for choosing Fruities!
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAq7mXoVMsBKGHzzh6JaRQTVy1Aqq41XbQ",
  authDomain: "fruities-pos.firebaseapp.com",
  databaseURL: "https://fruities-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fruities-pos",
  storageBucket: "fruities-pos.firebasestorage.app",
  messagingSenderId: "263637850283",
  appId: "1:263637850283:web:8b487bcdb0f25c7b063fee"
};

const STORE_ID = "fruit-story-main";
const STEPS = ["confirmed","preparing","out","delivered"];

function setLiveStep(step){
  if(step === "placed") step = "confirmed";
  CURRENT_TRACKER_STEP = step;
  const index = Math.max(0, STEPS.indexOf(step));

  document.querySelectorAll(".step-card").forEach((card,i)=>{
    card.classList.remove("done","active","pending");
    if(i < index) card.classList.add("done");
    else if(i === index) card.classList.add("active");
    else card.classList.add("pending");
  });

  document.querySelectorAll(".dot").forEach((dot,i)=>{
    dot.classList.remove("done","active");
    if(i < index) dot.classList.add("done");
    if(i === index) dot.classList.add("active");
  });

  const fillHeights = ["0px","104px","208px","336px"];
  const railFill = document.getElementById("railFill");
  if(railFill) railFill.style.height = fillHeights[index] || "0px";

  const footer = document.getElementById("footerNote");
  const deliveredText = document.getElementById("deliveredText");

  if(step === "delivered"){
    if(footer) footer.textContent = "✅ Delivered successfully. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "Your order has been delivered successfully.";
  }else if(step === "out"){
    if(footer) footer.textContent = "🛵 Your rider is on the way. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }else if(step === "preparing"){
    if(footer) footer.textContent = "🍓 We’re preparing your order with care.";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }else{
    if(footer) footer.textContent = "✅ We’re handling your order with care. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }

  setTimeout(syncTrackerCircles, 40);
  setTimeout(refreshActiveDotPulse, 60);
  setTimeout(startPulseActiveWatcher, 120);
  setTimeout(refreshActiveDotPulse, 50);
}

function fmtTime(v){
  if(!v) return "";
  try{
    return new Date(v).toLocaleString("en-PH",{
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    });
  }catch(e){ return ""; }
}

function applyTimes(order){
  document.getElementById("time-confirmed").textContent =
    fmtTime(order.time || order.createdAt || order.createdByAt);

  document.getElementById("time-preparing").textContent =
    fmtTime(order.kitStart || order.preparingAt);

  document.getElementById("time-out").textContent =
    fmtTime(order.outForDeliveryAt || order.deliveryOutAt || order.kitOutAt);

  document.getElementById("time-delivered").textContent =
    fmtTime(order.deliveredAt || order.deliveryDeliveredAt || order.deliveryDoneAt);
}

function detectStep(order){
  order = order || {};
  const delivery = String(order.deliveryStatus || order.delivery_status || "").toLowerCase();
  const kit = String(order.kitStatus || "").toLowerCase();
  const kitchen = String(order.kitchenStatus || "").toLowerCase();
  const status = String(order.status || "").toLowerCase();

  if(delivery === "delivered" || delivery === "done" || status === "delivered") return "delivered";
  if(delivery === "out" || delivery === "out_for_delivery" || kit === "out" || kitchen === "out") return "out";
  if(kit === "preparing" || kitchen === "preparing" || kit === "ready" || kitchen === "ready") return "preparing";
  return "confirmed";
}

function cleanKey(v){
  return String(v || "").replace(/[.#$[\]/]/g,"_");
}

function loadLiveOrder(){
  const params = new URLSearchParams(location.search);
  const orderId = params.get("id") || params.get("order");

  if(!orderId){
    setLiveStep(params.get("step") || "confirmed");
    return;
  }

  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const key = cleanKey(orderId);
    const ref = firebase.database().ref("stores/" + STORE_ID + "/orders/" + key);

    ref.on("value", snap=>{
      const order = snap.val();
      if(!order){
        setLiveStep("confirmed");
        return;
      }
      setLiveStep(detectStep(order));
      applyTimes(order);
    }, ()=>{
      setLiveStep(params.get("step") || "confirmed");
    });
  }catch(e){
    console.warn(e);
    setLiveStep(params.get("step") || "confirmed");
  }
}





/* tracker-pulse-follow-active-card-v3 */
function refreshActiveDotPulse(){
  document.querySelectorAll(".active-dot-pulse").forEach(function(el){
    el.remove();
  });

  var active = document.querySelector(".step-card.active");
  if(!active) return;

  active.style.overflow = "visible";

  var pulse = document.createElement("span");
  pulse.className = "active-dot-pulse";
  active.appendChild(pulse);
}

function startPulseActiveWatcher(){
  var cards = document.querySelector(".cards");
  if(!cards || cards.__pulseWatcherStarted) return;
  cards.__pulseWatcherStarted = true;

  var observer = new MutationObserver(function(){
    clearTimeout(window.__pulseRefreshTimer);
    window.__pulseRefreshTimer = setTimeout(function(){
      refreshActiveDotPulse();
    }, 40);
  });

  observer.observe(cards, {
    subtree:true,
    attributes:true,
    attributeFilter:["class"]
  });

  refreshActiveDotPulse();
}

loadLiveOrder();
setTimeout(startPulseActiveWatcher, 800);
setTimeout(refreshActiveDotPulse, 900);
setTimeout(refreshActiveDotPulse, 700);
setTimeout(refreshActiveDotPulse, 500);
</script>
</body>
</html>
