<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js">
/* tracker-smart-circle-align-v1 */
let CURRENT_TRACKER_STEP = "confirmed";

function syncTrackerCircles(){
  const tracker = document.querySelector(".tracker");
  const rail = document.querySelector(".rail");
  const cards = Array.from(document.querySelectorAll(".step-card"));
  const dots = Array.from(document.querySelectorAll(".dot"));
  const fill = document.getElementById("railFill");

  if(!tracker || !rail || !cards.length || !dots.length) return;

  const trackerTop = tracker.getBoundingClientRect().top;
  const centers = cards.map(card => {
    const r = card.getBoundingClientRect();
    return (r.top - trackerTop) + (r.height / 2);
  });

  dots.forEach((dot, i) => {
    if(centers[i] != null){
      dot.style.top = centers[i] + "px";
    }
  });

  const first = centers[0] || 0;
  const last = centers[centers.length - 1] || first;
  rail.style.setProperty("--rail-top", first + "px");
  rail.style.setProperty("--rail-height", Math.max(0, last - first) + "px");

  const stepIndex = Math.max(0, STEPS.indexOf(CURRENT_TRACKER_STEP === "placed" ? "confirmed" : CURRENT_TRACKER_STEP));
  const activeCenter = centers[stepIndex] || first;

  rail.style.setProperty("--rail-fill", Math.max(0, activeCenter - first) + "px");

  const railHeight = (tracker.getBoundingClientRect().height || last + 80);
  rail.style.minHeight = railHeight + "px";

  if(fill){
    fill.style.height = Math.max(0, activeCenter - first) + "px";
  }
}

window.addEventListener("resize", syncTrackerCircles);
window.addEventListener("load", function(){
  setTimeout(syncTrackerCircles, 80);
  setTimeout(syncTrackerCircles, 400);
});

document.querySelectorAll(".art img, .logo img").forEach(img => {
  img.addEventListener("load", function(){
    setTimeout(syncTrackerCircles, 60);
  });
});


/* tracker-card-attached-timeline-v1 */
function syncTrackerCircles(){
  const cardsBox = document.querySelector(".cards");
  const cards = Array.from(document.querySelectorAll(".step-card"));
  if(!cardsBox || !cards.length) return;

  const first = cards[0].offsetTop + cards[0].offsetHeight / 2;
  const last = cards[cards.length - 1].offsetTop + cards[cards.length - 1].offsetHeight / 2;

  const stepName = CURRENT_TRACKER_STEP === "placed" ? "confirmed" : CURRENT_TRACKER_STEP;
  const stepIndex = Math.max(0, STEPS.indexOf(stepName));
  const active = cards[stepIndex]
    ? cards[stepIndex].offsetTop + cards[stepIndex].offsetHeight / 2
    : first;

  cardsBox.style.setProperty("--track-top", first + "px");
  cardsBox.style.setProperty("--track-height", Math.max(0, last - first) + "px");
  cardsBox.style.setProperty("--track-fill", Math.max(0, active - first) + "px");
}

window.addEventListener("resize", function(){
  setTimeout(syncTrackerCircles, 50);
});

window.addEventListener("load", function(){
  setTimeout(syncTrackerCircles, 100);
  setTimeout(syncTrackerCircles, 500);
});

document.querySelectorAll(".art img,.logo img").forEach(function(img){
  img.addEventListener("load", function(){
    setTimeout(syncTrackerCircles, 80);
  });
});

</script>

<body>
<div class="page">
  <div class="topbar">
    <button onclick="history.back()">‹</button>
    <a href="/">Help</a>
  </div>

  <div class="logo">
    <img src="/assets/tracker/fruities-logo-transparent.png" alt="Fruities">
  </div>

  <div class="tracker">
    <div class="rail">
      <div class="rail-fill" id="railFill"></div>
      <div class="dots">
        <div class="dot" data-dot="confirmed">✓</div>
        <div class="dot" data-dot="preparing">✓</div>
        <div class="dot" data-dot="out">✓</div>
        <div class="dot" data-dot="delivered">●</div>
      </div>
    </div>

    <div class="cards">
      <section class="step-card" data-step="confirmed">
        <div>
          <h3>Order confirmed</h3>
          <p>Your order is confirmed.</p>
          <div class="time" id="time-confirmed"></div>
        </div>
        <div class="art"><img src="/assets/tracker/order-confirmed.png" alt=""></div>
      </section>

      <section class="step-card" data-step="preparing">
        <div>
          <h3>Preparing</h3>
          <p>We’re preparing your order.</p>
          <div class="time" id="time-preparing"></div>
        </div>
        <div class="art"><img src="/assets/tracker/preparing.png" alt=""></div>
      </section>

      <section class="step-card" data-step="out">
        <div>
          <h3>Out for delivery</h3>
          <p>Your rider is on the way to deliver your order.</p>
          <div class="time" id="time-out"></div>
        </div>
        <div class="art"><img src="/assets/tracker/out-for-delivery.png" alt=""></div>
      </section>

      <section class="step-card delivered" data-step="delivered">
        <div>
          <h3>Delivered</h3>
          <p id="deliveredText">We’ll update you here once your order is delivered.</p>
          <div class="time" id="time-delivered"></div>
        </div>
        <div class="art"><img src="/assets/tracker/delivered.png" alt=""></div>
      </section>
    </div>
  </div>

  <div class="footer" id="footerNote">
    ✅ We’re handling your order with care. Thank you for choosing Fruities!
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyAq7mXoVMsBKGHzzh6JaRQTVy1Aqq41XbQ",
  authDomain: "fruities-pos.firebaseapp.com",
  databaseURL: "https://fruities-pos-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "fruities-pos",
  storageBucket: "fruities-pos.firebasestorage.app",
  messagingSenderId: "263637850283",
  appId: "1:263637850283:web:8b487bcdb0f25c7b063fee"
};

const STORE_ID = "fruit-story-main";
const STEPS = ["confirmed","preparing","out","delivered"];

function setLiveStep(step){
  if(step === "placed") step = "confirmed";
  CURRENT_TRACKER_STEP = step;
  const index = Math.max(0, STEPS.indexOf(step));

  document.querySelectorAll(".step-card").forEach((card,i)=>{
    card.classList.remove("done","active","pending");
    if(i < index) card.classList.add("done");
    else if(i === index) card.classList.add("active");
    else card.classList.add("pending");
  });

  document.querySelectorAll(".dot").forEach((dot,i)=>{
    dot.classList.remove("done","active");
    if(i < index) dot.classList.add("done");
    if(i === index) dot.classList.add("active");
  });

  const fillHeights = ["0px","104px","208px","336px"];
  const railFill = document.getElementById("railFill");
  if(railFill) railFill.style.height = fillHeights[index] || "0px";

  const footer = document.getElementById("footerNote");
  const deliveredText = document.getElementById("deliveredText");

  if(step === "delivered"){
    if(footer) footer.textContent = "✅ Delivered successfully. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "Your order has been delivered successfully.";
  }else if(step === "out"){
    if(footer) footer.textContent = "🛵 Your rider is on the way. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }else if(step === "preparing"){
    if(footer) footer.textContent = "🍓 We’re preparing your order with care.";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }else{
    if(footer) footer.textContent = "✅ We’re handling your order with care. Thank you for choosing Fruities!";
    if(deliveredText) deliveredText.textContent = "We’ll update you here once your order is delivered.";
  }

  setTimeout(syncTrackerCircles, 40);
}

function fmtTime(v){
  if(!v) return "";
  try{
    return new Date(v).toLocaleString("en-PH",{
      year:"numeric",
      month:"long",
      day:"numeric",
      hour:"numeric",
      minute:"2-digit",
      hour12:true
    });
  }catch(e){ return ""; }
}

function applyTimes(order){
  document.getElementById("time-confirmed").textContent =
    fmtTime(order.time || order.createdAt || order.createdByAt);

  document.getElementById("time-preparing").textContent =
    fmtTime(order.kitStart || order.preparingAt);

  document.getElementById("time-out").textContent =
    fmtTime(order.outForDeliveryAt || order.deliveryOutAt || order.kitOutAt);

  document.getElementById("time-delivered").textContent =
    fmtTime(order.deliveredAt || order.deliveryDeliveredAt || order.deliveryDoneAt);
}

function detectStep(order){
  order = order || {};
  const delivery = String(order.deliveryStatus || order.delivery_status || "").toLowerCase();
  const kit = String(order.kitStatus || "").toLowerCase();
  const kitchen = String(order.kitchenStatus || "").toLowerCase();
  const status = String(order.status || "").toLowerCase();

  if(delivery === "delivered" || delivery === "done" || status === "delivered") return "delivered";
  if(delivery === "out" || delivery === "out_for_delivery" || kit === "out" || kitchen === "out") return "out";
  if(kit === "preparing" || kitchen === "preparing" || kit === "ready" || kitchen === "ready") return "preparing";
  return "confirmed";
}

function cleanKey(v){
  return String(v || "").replace(/[.#$[\]/]/g,"_");
}

function loadLiveOrder(){
  const params = new URLSearchParams(location.search);
  const orderId = params.get("id") || params.get("order");

  if(!orderId){
    setLiveStep(params.get("step") || "confirmed");
    return;
  }

  try{
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const key = cleanKey(orderId);
    const ref = firebase.database().ref("stores/" + STORE_ID + "/orders/" + key);

    ref.on("value", snap=>{
      const order = snap.val();
      if(!order){
        setLiveStep("confirmed");
        return;
      }
      setLiveStep(detectStep(order));
      applyTimes(order);
    }, ()=>{
      setLiveStep(params.get("step") || "confirmed");
    });
  }catch(e){
    console.warn(e);
    setLiveStep(params.get("step") || "confirmed");
  }
}

loadLiveOrder();
</script>
</body>
</html>
